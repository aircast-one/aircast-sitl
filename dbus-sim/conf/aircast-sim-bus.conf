<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <!-- Both EXTERNAL and ANONYMOUS are required. godbus (Go) only
       attempts EXTERNAL; python-dbus prefers ANONYMOUS. Removing
       either re-introduces the auth-mismatch bug fixed in d9ca969. -->
  <auth>EXTERNAL</auth>
  <auth>ANONYMOUS</auth>
  <allow_anonymous/>
  <policy context="default">
    <allow user="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
  </policy>
  <limit name="max_message_size">134217728</limit>
  <limit name="max_message_unix_fds">4096</limit>
</busconfig>
