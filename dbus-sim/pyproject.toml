[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircast-sim"
version = "0.1.0"
description = "aircast D-Bus simulator (Phase 1 skeleton)"
requires-python = ">=3.11"
dependencies = [
    "python-dbusmock>=0.30,<2.0",
]

[tool.setuptools.packages.find]
include = ["aircast_sim*"]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501 (line too long) is handled by ruff format; B008 (function call in
# default arg) trips on argparse default factories used by Click/typer
# elsewhere — not strictly needed here, but reserve the override.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
# python-dbusmock and dbus have no published stubs; without
# ignore_missing_imports mypy errors on every import.
ignore_missing_imports = true
strict_equality = true
