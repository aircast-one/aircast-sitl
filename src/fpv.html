<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircast SITL - 3D FPV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #canvas { width: 100vw; height: 100vh; display: block; }

        /* HUD overlay */
        .hud { position: fixed; color: #0f0; font-family: 'Monaco', 'Consolas', monospace; font-size: 13px; text-shadow: 0 0 4px rgba(0,255,0,0.5); pointer-events: none; z-index: 10; }
        .hud-top-left { top: 16px; left: 16px; }
        .hud-top-right { top: 16px; right: 16px; text-align: right; }
        .hud-bottom-left { bottom: 16px; left: 16px; }
        .hud-bottom-right { bottom: 16px; right: 16px; text-align: right; }
        .hud-center { top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }

        .hud-value { font-size: 18px; font-weight: bold; }
        .hud-label { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
        .hud-row { margin-bottom: 6px; }
        .hud-separator { border-top: 1px solid rgba(0,255,0,0.3); margin: 8px 0; }

        /* Connection status */
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-connected { background: #0f0; box-shadow: 0 0 6px #0f0; }
        .status-disconnected { background: #f00; box-shadow: 0 0 6px #f00; }

        /* Crosshair */
        .crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        .crosshair svg { filter: drop-shadow(0 0 2px rgba(0,255,0,0.4)); }

        /* Back button */
        .back-btn { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,0.6); color: #0f0; border: 1px solid rgba(0,255,0,0.3); padding: 6px 16px; border-radius: 4px; cursor: pointer; font-family: 'Monaco', monospace; font-size: 12px; pointer-events: auto; }
        .back-btn:hover { background: rgba(0,255,0,0.1); }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <a href="/" class="back-btn">SITL Dashboard</a>

    <!-- Crosshair -->
    <div class="crosshair">
        <svg width="40" height="40" viewBox="0 0 40 40">
            <line x1="20" y1="0" x2="20" y2="15" stroke="#0f0" stroke-width="1" opacity="0.6"/>
            <line x1="20" y1="25" x2="20" y2="40" stroke="#0f0" stroke-width="1" opacity="0.6"/>
            <line x1="0" y1="20" x2="15" y2="20" stroke="#0f0" stroke-width="1" opacity="0.6"/>
            <line x1="25" y1="20" x2="40" y2="20" stroke="#0f0" stroke-width="1" opacity="0.6"/>
            <circle cx="20" cy="20" r="3" fill="none" stroke="#0f0" stroke-width="1" opacity="0.4"/>
        </svg>
    </div>

    <!-- HUD: Attitude -->
    <div class="hud hud-top-left" id="hud-attitude">
        <div class="hud-row"><span class="hud-label">Roll</span><br><span class="hud-value" id="hud-roll">0.0°</span></div>
        <div class="hud-row"><span class="hud-label">Pitch</span><br><span class="hud-value" id="hud-pitch">0.0°</span></div>
        <div class="hud-row"><span class="hud-label">Yaw</span><br><span class="hud-value" id="hud-yaw">0.0°</span></div>
    </div>

    <!-- HUD: Position -->
    <div class="hud hud-top-right" id="hud-position">
        <div class="hud-row"><span class="hud-label">Alt AGL</span><br><span class="hud-value" id="hud-alt">0.0 m</span></div>
        <div class="hud-row"><span class="hud-label">Speed</span><br><span class="hud-value" id="hud-speed">0.0 m/s</span></div>
        <div class="hud-row"><span class="hud-label">Heading</span><br><span class="hud-value" id="hud-heading">0°</span></div>
    </div>

    <!-- HUD: Status -->
    <div class="hud hud-bottom-left" id="hud-status">
        <div class="hud-row"><span class="status-dot status-disconnected" id="status-dot"></span><span id="status-text">Connecting...</span></div>
        <div class="hud-row" id="hud-armed" style="display:none"><span class="hud-value" style="color:#f00">ARMED</span></div>
    </div>

    <!-- HUD: GPS -->
    <div class="hud hud-bottom-right" id="hud-gps">
        <div class="hud-row"><span class="hud-label">Lat</span> <span id="hud-lat">--</span></div>
        <div class="hud-row"><span class="hud-label">Lng</span> <span id="hud-lng">--</span></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';

    // =========================================================================
    // Scene Setup
    // =========================================================================
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();

    // Sky color
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 200, 800);

    // Camera (FPV perspective)
    const camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0.5, 0); // Start on ground

    // =========================================================================
    // Lighting
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0x6688cc, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffee, 1.2);
    sunLight.position.set(100, 200, 50);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -100;
    sunLight.shadow.camera.right = 100;
    sunLight.shadow.camera.top = 100;
    sunLight.shadow.camera.bottom = -100;
    scene.add(sunLight);

    const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x556633, 0.4);
    scene.add(hemiLight);

    // =========================================================================
    // Ground
    // =========================================================================
    const groundSize = 1000;

    // Grass ground
    const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize, 50, 50);
    // Add slight height variation for realism
    const vertices = groundGeo.attributes.position;
    for (let i = 0; i < vertices.count; i++) {
        const x = vertices.getX(i);
        const y = vertices.getY(i);
        vertices.setZ(i, (Math.sin(x * 0.05) * Math.cos(y * 0.05)) * 0.3);
    }
    groundGeo.computeVertexNormals();

    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4a7c3f });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // =========================================================================
    // Runway
    // =========================================================================
    const runwayGeo = new THREE.PlaneGeometry(100, 10);
    const runwayMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
    const runway = new THREE.Mesh(runwayGeo, runwayMat);
    runway.rotation.x = -Math.PI / 2;
    runway.position.y = 0.01;
    runway.receiveShadow = true;
    scene.add(runway);

    // Runway center line
    for (let i = -45; i < 45; i += 5) {
        const markGeo = new THREE.PlaneGeometry(3, 0.3);
        const markMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const mark = new THREE.Mesh(markGeo, markMat);
        mark.rotation.x = -Math.PI / 2;
        mark.position.set(i, 0.02, 0);
        scene.add(mark);
    }

    // =========================================================================
    // Buildings
    // =========================================================================
    function createBuilding(x, z, w, d, h, color) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mat = new THREE.MeshLambertMaterial({ color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, h / 2, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        return mesh;
    }

    createBuilding(30, -20, 10, 10, 12, 0x996644);
    createBuilding(-20, 30, 8, 12, 18, 0x778899);
    createBuilding(40, 15, 6, 6, 8, 0xbbbb77);
    createBuilding(-35, -25, 12, 8, 10, 0x997766);
    createBuilding(15, -40, 7, 7, 14, 0x8899aa);
    createBuilding(-50, 10, 15, 10, 6, 0xaa8866);

    // =========================================================================
    // Trees
    // =========================================================================
    function createTree(x, z, trunkH, canopyR) {
        const group = new THREE.Group();

        // Trunk
        const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, trunkH, 8);
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x664422 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = trunkH / 2;
        trunk.castShadow = true;
        group.add(trunk);

        // Canopy
        const canopyGeo = new THREE.SphereGeometry(canopyR, 8, 8);
        const canopyMat = new THREE.MeshLambertMaterial({ color: 0x228833 + Math.floor(Math.random() * 0x224422) });
        const canopy = new THREE.Mesh(canopyGeo, canopyMat);
        canopy.position.y = trunkH + canopyR * 0.6;
        canopy.castShadow = true;
        group.add(canopy);

        group.position.set(x, 0, z);
        scene.add(group);
        return group;
    }

    // Scatter trees
    const treePositions = [
        [15, -12], [-10, -18], [25, 8], [-8, 25], [35, -35],
        [-30, -10], [10, 30], [-25, 35], [45, 25], [-40, -35],
        [20, -25], [-15, 15], [50, -10], [-45, 20], [5, 45],
        [-20, -40], [30, 40], [-35, 5], [55, -25], [-50, -20],
    ];
    treePositions.forEach(([x, z]) => {
        createTree(x, z, 2 + Math.random() * 3, 1.5 + Math.random() * 1.5);
    });

    // =========================================================================
    // Landing pad (home position marker)
    // =========================================================================
    const padGeo = new THREE.RingGeometry(1, 1.5, 32);
    const padMat = new THREE.MeshBasicMaterial({ color: 0xff4444, side: THREE.DoubleSide });
    const pad = new THREE.Mesh(padGeo, padMat);
    pad.rotation.x = -Math.PI / 2;
    pad.position.y = 0.02;
    scene.add(pad);

    // H marking
    const hShape = new THREE.Group();
    const barGeo = new THREE.PlaneGeometry(0.15, 1.2);
    const barMat = new THREE.MeshBasicMaterial({ color: 0xff4444, side: THREE.DoubleSide });
    const leftBar = new THREE.Mesh(barGeo, barMat);
    leftBar.position.x = -0.4;
    hShape.add(leftBar);
    const rightBar = new THREE.Mesh(barGeo, barMat);
    rightBar.position.x = 0.4;
    hShape.add(rightBar);
    const midBar = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.15), barMat);
    hShape.add(midBar);
    hShape.rotation.x = -Math.PI / 2;
    hShape.position.y = 0.03;
    scene.add(hShape);

    // =========================================================================
    // Telemetry State
    // =========================================================================
    const telemetry = {
        roll: 0, pitch: 0, yaw: 0,
        lat: 0, lng: 0, alt: 0, relativeAlt: 0,
        vx: 0, vy: 0, vz: 0,
        heading: 0, groundspeed: 0, airspeed: 0, climb: 0,
        armed: false,
        connected: false,
        homeSet: false, homeLat: 0, homeLng: 0,
    };

    // Smoothed values for rendering
    const smooth = { roll: 0, pitch: 0, yaw: 0, x: 0, y: 0.5, z: 0 };

    // =========================================================================
    // WebSocket Connection
    // =========================================================================
    function connectWebSocket() {
        const wsHost = window.location.hostname || 'localhost';
        const wsUrl = `ws://${wsHost}:8889`;

        const ws = new WebSocket(wsUrl);
        ws.onopen = () => {
            telemetry.connected = true;
            updateStatusHUD();
        };
        ws.onclose = () => {
            telemetry.connected = false;
            updateStatusHUD();
            setTimeout(connectWebSocket, 2000);
        };
        ws.onerror = () => {
            ws.close();
        };
        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                handleTelemetry(msg);
            } catch (e) {}
        };
    }

    function handleTelemetry(msg) {
        switch (msg.type) {
            case 'ATTITUDE':
                telemetry.roll = msg.roll;
                telemetry.pitch = msg.pitch;
                telemetry.yaw = msg.yaw;
                break;
            case 'GLOBAL_POSITION_INT':
                if (!telemetry.homeSet && msg.lat !== 0) {
                    telemetry.homeLat = msg.lat;
                    telemetry.homeLng = msg.lng;
                    telemetry.homeSet = true;
                }
                telemetry.lat = msg.lat;
                telemetry.lng = msg.lng;
                telemetry.alt = msg.alt;
                telemetry.relativeAlt = msg.relative_alt;
                telemetry.vx = msg.vx;
                telemetry.vy = msg.vy;
                telemetry.vz = msg.vz;
                telemetry.heading = msg.hdg;
                break;
            case 'VFR_HUD':
                telemetry.groundspeed = msg.groundspeed;
                telemetry.airspeed = msg.airspeed;
                telemetry.heading = msg.heading;
                telemetry.climb = msg.climb;
                break;
            case 'HEARTBEAT':
                telemetry.armed = msg.armed;
                break;
        }
        updateHUD();
    }

    // =========================================================================
    // HUD Updates
    // =========================================================================
    const toDeg = (r) => (r * 180 / Math.PI).toFixed(1);

    function updateHUD() {
        document.getElementById('hud-roll').textContent = toDeg(telemetry.roll) + '°';
        document.getElementById('hud-pitch').textContent = toDeg(telemetry.pitch) + '°';
        document.getElementById('hud-yaw').textContent = toDeg(telemetry.yaw) + '°';
        document.getElementById('hud-alt').textContent = telemetry.relativeAlt.toFixed(1) + ' m';
        document.getElementById('hud-speed').textContent = telemetry.groundspeed.toFixed(1) + ' m/s';
        document.getElementById('hud-heading').textContent = Math.round(telemetry.heading) + '°';
        document.getElementById('hud-lat').textContent = telemetry.lat.toFixed(7);
        document.getElementById('hud-lng').textContent = telemetry.lng.toFixed(7);

        const armedEl = document.getElementById('hud-armed');
        armedEl.style.display = telemetry.armed ? 'block' : 'none';
    }

    function updateStatusHUD() {
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        if (telemetry.connected) {
            dot.className = 'status-dot status-connected';
            text.textContent = 'Connected';
        } else {
            dot.className = 'status-dot status-disconnected';
            text.textContent = 'Connecting...';
        }
    }

    // =========================================================================
    // GPS to local coordinates (meters from home)
    // =========================================================================
    function gpsToLocal(lat, lng) {
        if (!telemetry.homeSet) return { x: 0, z: 0 };
        const dlat = lat - telemetry.homeLat;
        const dlng = lng - telemetry.homeLng;
        const metersPerDegLat = 111320;
        const metersPerDegLng = 111320 * Math.cos(telemetry.homeLat * Math.PI / 180);
        return {
            x: dlng * metersPerDegLng,  // East
            z: -dlat * metersPerDegLat, // North (negative because Three.js Z is south)
        };
    }

    // =========================================================================
    // Animation Loop
    // =========================================================================
    const LERP = 0.1; // Smoothing factor

    function animate() {
        requestAnimationFrame(animate);

        // Convert GPS to local position
        const localPos = gpsToLocal(telemetry.lat, telemetry.lng);

        // Smooth interpolation
        smooth.roll += (telemetry.roll - smooth.roll) * LERP;
        smooth.pitch += (telemetry.pitch - smooth.pitch) * LERP;

        // Handle yaw wrapping (shortest path)
        let yawDiff = telemetry.yaw - smooth.yaw;
        if (yawDiff > Math.PI) yawDiff -= 2 * Math.PI;
        if (yawDiff < -Math.PI) yawDiff += 2 * Math.PI;
        smooth.yaw += yawDiff * LERP;

        smooth.x += (localPos.x - smooth.x) * LERP;
        smooth.y += (telemetry.relativeAlt + 0.3 - smooth.y) * LERP;
        smooth.z += (localPos.z - smooth.z) * LERP;

        // Update camera position
        camera.position.set(smooth.x, Math.max(smooth.y, 0.3), smooth.z);

        // Apply attitude as camera rotation
        // FPV camera: yaw rotates around Y, pitch around X, roll around Z
        const euler = new THREE.Euler(
            -smooth.pitch,  // pitch: nose down = look down
            -smooth.yaw + Math.PI/2,  // yaw: heading
            -smooth.roll,   // roll: bank
            'YXZ'
        );
        camera.quaternion.setFromEuler(euler);

        renderer.render(scene, camera);
    }

    // =========================================================================
    // Resize handler
    // =========================================================================
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // Start
    // =========================================================================
    connectWebSocket();
    animate();
    </script>
</body>
</html>
