name: dbus-sim

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'dbus-sim/**'
      - '.github/workflows/dbus-sim.yml'
  pull_request:
    paths:
      - 'dbus-sim/**'
      - '.github/workflows/dbus-sim.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aircast-one/aircast-sim

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Build and smoke test
        working-directory: dbus-sim
        run: just test

  publish:
    needs: smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # master branch push
            echo "tags=${IMAGE}:dev,${IMAGE}:dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: dbus-sim
          file: dbus-sim/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=dbus-sim
          cache-to: type=gha,mode=max,scope=dbus-sim
