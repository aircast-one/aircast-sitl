name: GHCR Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would be deleted without deleting
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete untagged images not referenced by any tag
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          owner: aircast-one
          package: aircast-sitl
          keep-n-untagged: 10
          validate: true
          dry-run: ${{ inputs.dry_run || false }}
