name: Build and Deploy

on:
  push:
    branches: [ master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v3.4.0
        with:
          skip_after_successful_duplicate: 'true'

  build:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/develop' && 'development' || '' }}
    permissions:
      contents: write
      packages: write
      id-token: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ github.ref == 'refs/heads/develop' && 'development' || 'production' }}

    env:
      IMAGE_BASE: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment
        run: |
          echo "REPO_NAME=${IMAGE_BASE,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Generate version
        id: version
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/heads/develop ]]; then
            echo "version=v0.0.0-dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "is_develop=true" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/heads/master ]]; then
            echo "version=v0.0.0-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "version=pr-${{ github.event.number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.REPO_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.REPO_NAME }}:${{ steps.version.outputs.is_develop == 'true' && 'latest-dev' || steps.version.outputs.is_release == 'true' && 'latest' || 'pr' }}
          build-args: |
            VITE_CESIUM_ION_TOKEN=${{ vars.VITE_CESIUM_ION_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Aircast SITL ${{ github.ref_name }}
          body: |
            ## Aircast SITL ${{ github.ref_name }}

            ### Docker Images
            ```bash
            docker pull ghcr.io/${{ env.REPO_NAME }}:${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ env.REPO_NAME }}:latest
            ```

      - name: Build Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## 🚁 SITL Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Image:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.REPO_NAME }}:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/develop' }}

    steps:
      - name: Trigger GitOps update
        run: |
          echo "📡 Triggering GitOps repository update..."

          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/aircast-one/aircast-gitops/dispatches \
            -d '{
              "event_type": "update-image",
              "client_payload": {
                "app_name": "aircast-sitl",
                "environment": "${{ needs.build.outputs.environment }}",
                "image_tag": "${{ needs.build.outputs.version }}"
              }
            }'

          echo "✅ GitOps update triggered for aircast-sitl"
          echo "Environment: ${{ needs.build.outputs.environment }}"
          echo "Image: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}"
